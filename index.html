<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 01 | Sirapat Khongkha</title>
    <style>
      :root {
        --navy: #172554;
        --blue: #2563eb;
        --ink: #172033;
        --muted: #63708a;
        --line: #dbe3f0;
        --paper: #ffffff;
        --canvas: #f4f7fb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at 12% 10%, #dbeafe 0, transparent 28rem),
          var(--canvas);
      }

      main {
        width: min(100%, 680px);
      }

      .card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--paper);
        box-shadow: 0 18px 45px rgba(23, 37, 84, 0.1);
      }

      .heading {
        padding: 32px 36px 28px;
        color: white;
        background: linear-gradient(125deg, var(--navy), var(--blue));
      }

      .label {
        margin: 0 0 10px;
        color: #bfdbfe;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        letter-spacing: -0.03em;
      }

      .content { padding: 32px 36px 36px; }

      .intro {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 1.06rem;
        line-height: 1.6;
      }

      dl {
        display: grid;
        grid-template-columns: minmax(130px, 0.7fr) 1.3fr;
        margin: 0;
        border-top: 1px solid var(--line);
      }

      dt, dd {
        margin: 0;
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
      }

      dt {
        color: var(--muted);
        font-weight: 600;
      }

      dd {
        color: var(--navy);
        font-size: 1.08rem;
        font-weight: 700;
      }

      footer {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.85rem;
        text-align: center;
      }

      @media (max-width: 480px) {
        body { padding: 16px; }
        .heading, .content { padding: 26px 24px; }
        dl { grid-template-columns: 1fr; }
        dt { padding-bottom: 5px; border-bottom: 0; }
        dd { padding-top: 5px; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="page-title">
        <header class="heading">
          <p class="label">University Assignment</p>
          <h1 id="page-title">Exercise 01</h1>
        </header>

        <div class="content">
          <p class="intro">Welcome to my personal webpage. Below is my student information.</p>
          <dl>
            <dt>Student Name</dt>
            <dd>Sirapat Khongkha</dd>
            <dt>Student ID</dt>
            <dd>1143566</dd>
          </dl>
        </div>
      </section>
      <footer>Personal Webpage &middot; Exercise 01</footer>
    </main>
  </body>
</html>
